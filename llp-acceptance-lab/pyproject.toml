[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llp-acceptance-lab"
version = "0.1.0"
description = "Toy acceptance calculations for long-lived particle decays."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "LLP Acceptance Lab" }
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
